name: Release

# Trigger: push a tag like v1.0.0, v1.2.3, etc.
#
# Workflow:
#   1. Cross-compile binaries for all platforms (Go cross-compilation is pure,
#      no CGO, so a single Linux runner suffices).
#   2. Generate SHA-256 checksums.
#   3. Create a GitHub Release and attach all artifacts.
#
# No extra secrets needed — GITHUB_TOKEN is provided automatically.

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write   # needed to create a release

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so `git describe` works in the Makefile

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all platforms
        run: make build-all VERSION=${{ github.ref_name }}

      - name: Generate checksums
        run: |
          cd bin
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            bin/*
